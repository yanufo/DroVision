services:
  drovision-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app

    ports:
      - "8501:8501"

    volumes:
      # Host directories
      - /home:/home
      - /data:/data
      - /inspection:/inspection
      
      # Runtime configuration files (mounted from config directory)
      - ./config/config.yml:/app/config/config.yml:ro

    env_file:
      - .env

    environment:
      - AIRFLOW_URL=http://host.docker.internal:8083
      - AIRFLOW_API_USER=airflow
      - AIRFLOW_API_PASSWORD=airflow

    depends_on:
      # - mysql
      mysql:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - airflow-network


  mysql:
    build:
      context: .
      dockerfile: Dockerfile
      target: mysql-db

    container_name: row-mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 3s
      retries: 12

    volumes:
      - mysql_data:/var/lib/mysql
      # - ./config/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - airflow-network


volumes:
  mysql_data:

networks:
  airflow-network:
    external: true