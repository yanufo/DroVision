services:
  drovision-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app

    ports:
      - "8501:8501"

    volumes:
      # Host directories
      - /home:/home
      - /data:/data
      # - /inspection:/inspection
      
      # Runtime configuration files (mounted from config directory)
      - ./config/config.yml:/app/config/config.yml:ro

    env_file:
      - ./config/.env

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - airflow-network


  mysql:
    build:
      context: .
      dockerfile: Dockerfile
      target: mysql-db

    container_name: row-mysql
    restart: unless-stopped

    env_file:
      - ./config/.env

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 3s
      retries: 12

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - airflow-network


volumes:
  mysql_data:

networks:
  airflow-network:
    external: true